<html>

<head>
<title>Template Client Form</title>
</head> 

 <PREADD SETPARM CURRENTSERIAL="||PREGENDOCSERNO||">
<PREEDIT SETPARM CURRENTSERIAL="||FIELDVALUE DOCSERNO||">
 <PREADD SETPARM CURRENTPARENT="||SCREENPARM PARENTSERIAL||">
<PREEDIT SETPARM CURRENTPARENT="||FIELDVALUE PARENTDOCSERNO||">

<script language="JavaScript">

function startup() {
   if ("||DOCSERNO||"=="") {
      //***Commands here will execute when the record is new
      document.forms[0]._B2.style.display = 'none';
   }
   else {
      if("||SCREENPARM OPTION||" == "PRINTFORMAT") {
         //***Commands here will execute when the form is printed
      }
      else {
         //***Commands here will execute when the form is being edited
        document.forms[0]._B1.style.display = "";
        document.forms[0]._B2.style.display = "";
        document.forms[0]._B3.style.display = "";
      }
   }
}

function validateform() {
   var edesc="";
// signature verification
   try {edesc=verifysignatures()
    } catch(e) {}
   return edesc;
}

function submitit() {
   errdesc=validateform();
   if (errdesc!="") {alert(errdesc); return;}   
   var f=document.forms[0];
   //***Error checking should be done here before a quick save
   f.target="fvalidate";
   f.submit();
   $(':button').prop('disabled',true);
   return;
}

function deleteit() {
   functionreturnvalue = null;
   var f = document.forms[0];
   if ("||DOCSERNO||" == "") {
       alert("Just click the X in the upper right hand corner to delete this.");
       return functionreturnvalue;
   }
   // check msgbox (yes/no) to confirm (ok/cancel) wording
   var msgtemp = confirm("Are you sure you want to delete this record?");
   if (msgtemp) { gg = 1 } else { gg = 7 }
   if (gg == 7) {
       return functionreturnvalue;
   }
   document.forms[0].FUNCTION.value = "DELETEDATA";
   document.forms[0].submit();
   $(':button').prop('disabled',true);
   return functionreturnvalue;
}

function quicksubmitit() {
   errdesc=validateform();
   if (errdesc!="") {alert(errdesc); return;}
   var f=document.forms[0];
   //***Error checking should be done here before a quick save
   document.forms[0]._B1.style.display = "none";
   document.forms[0]._B2.style.display = "none";
   document.forms[0]._B3.style.display = "none";
   f.target = "fvalidate";
   var DefaultSaveConfirm=document.forms[0].CONFIRMSCREEN.value;
   f.CONFIRMSCREEN.value = "SAVECONFIRMQUICK";
   f.submit();
   $(':button').prop('disabled',true);
   document.forms[0].CONFIRMSCREEN.value=DefaultSaveConfirm;
   return;
}

function QuickSubmitReturn() {
   var f=document.forms[0];
   //***Reset the form after a quick submit here
   document.forms[0]._B1.style.display = "";
   document.forms[0]._B2.style.display = "";
   document.forms[0]._B3.style.display = "";
   updatesignatures();
   alert("Record Saved");
   $(':button').prop('disabled',false);
   return;
}

function resetsave() {
   //***Commands here will reset the form if there is an error during save
   document.forms[0]._B1.style.display = "";
   document.forms[0]._B2.style.display = "";
   document.forms[0]._B3.style.display = "";
   $(':button').prop('disabled',false);
}

function ExpandText(fldname) {
   var o = document.forms[0].elements(fldname);
   g = parseInt(o.clientHeight / o.rows + .5);
   h = o.scrollHeight;
   h = parseInt(h / g) + 6;
   o.rows = h;
}

function updatesignatures(){
   if(document.getElementById("signaturedisplay")){
      //CHECK TO SEE IF THE SIGNATURE AREA EXISTS ON THE FORM
   }
   else {
      return;
   }
   var SigSection=document.getElementById("signaturedisplay")
   Stamp = new Date();
   var Hours;
   var Mins;
   var Time;
   Hours = Stamp.getHours();
   if (Hours >= 12) {
      Time = " PM";
   }
   else {
      Time = " AM";
   }
   if (Hours > 12) {
      Hours -= 12;
   }
   if (Hours == 0) {
      Hours = 12;
   }
   Mins = Stamp.getMinutes();
   if (Mins < 10) {
      Mins = "0" + Mins;
   }
   if (SigSection.innerHTML=="No signatures--new form") {
      //THIS CODE FIRES IF IT IS THE FIRST TIME A FORM IS BEING SAVED
      document.getElementById("signaturedisplay").innerHTML="Quick Saved by ||USERID|| of ||PROVIDERNAME|| (||PROVIDERCODE||) on ||DATE|| at " + Hours + ":" + Mins + Time + '';
   }
   else {
      var CurrentSigs=SigSection.innerHTML;
      document.getElementById("signaturedisplay").innerHTML=CurrentSigs+"<br>Quick Saved by ||USERID|| of ||PROVIDERNAME|| (||PROVIDERCODE||) on ||DATE|| at " + Hours + ":" + Mins + Time + '';
   }
   return;
}

</script>

||INCLUDE FUNCTIONSUMMATIONLIBRARY.HTM||

<body onLoad="startup()">
<!-- Field Override Area -->

<form action="genfunc.exe" method="post" enctype="multipart/form-data">
    <input type="hidden" name="FUNCTION" value="SAVE" />
    <input type="hidden" name="DOCSERNO" value="||DOCSERNO||" />
    <input type="hidden" name="PREGENDOCSERNO" value="||PREGENDOCSERNO||" />
    <input type="hidden" name="SESSIONID" value="||SESSIONID||" />
    <input type="hidden" name="TABLENAME" value="PWBHNChangeofScopeForm" />
    <input type="hidden" name="VISITDT" value="||DATE||" />
    <input type="hidden" name="VISITTM" value="||TIME||" />
    <input type="hidden" name="CLIENTNUMBER" value="||CLIENTNUMBER||" />
    <input type="hidden" name="PARENTDOCSERNO" value="||SP CURRENTPARENT||" />
    <input type="hidden" name="AUTOCLOSE" value="YES" />
    <input type="hidden" name="CONFIRMSCREEN" value="||||"/>

    <h1><span>BHN Change of Scope Form</span> ||CLIENTNAME|| (||CLIENTNUMBER||)</h1>

<!--This is the basic format for a form section-->
<div class="extrawidecol">
<div class="deflist">

</div>
</div>
||STARTSTRIP||
    <div align="center"><font size="1"><span id="signaturedisplay">||Signatures||</span></font><br />
    Signature: <input type="password" name="SIGNATURE" /><br />
    <input type="button" name="_B1" onclick="submitit()" value="SAVE" />
    <input type="button" name="_B2" onclick="deleteit()" value="DELETE" />
    <input type="button" name="_B3" onclick="quicksubmitit()" value="QUICK SUBMIT" /></div>
||ENDSTRIP||
</form>
</body>
</html>
