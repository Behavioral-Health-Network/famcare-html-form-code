  function popprovider(numelementsper,totalelements,identifier,results) {
    rgc=totalelements;

       rg[x]=new Array(10);
      for (y=1; y<=numelementsper; y++) {
        rg[x][y]=results[x][y];
      }
    }
    tall="<table border=1 cellpadding=0 cellspacing=0>";
    for (xx=1; xx<=rgc; xx++) {
      if (rg[xx][2]=="") {
       // we have a master task here.....
        tall=tall+"<tr><td"+buildbg(xx)+">"+buildcell(rg[xx][4],rg[xx][1],xx)+"</td>"+buildsub(rg[xx][1])
        tall=tall+"</tr>";
      }
    }
    document.getElementById("outgrid").innerHTML=tall;
  }
  
  function buildsub(mserno) {
    tall2="";

      if (rg[xxx][2]==mserno) {
        if (tall2=="") {tall2=tall2+"<td><table border=1 cellpadding=0 cellspacing=0>"} 
        tall2=tall2+"<tr><td"+buildbg(xxx)+">"+buildcell(rg[xxx][4],rg[xxx][1],xxx)+"</td>"+buildsub2(rg[xxx][1])+"</tr>";
      }
    }
    if (tall2!="") {tall2=tall2+"</table></td>";}
    return tall2;
  }

//    return ""; // just return no background color

function showprovider(serno) {
    urlassist="genfunc.exe?FULLFUNCTION^EDITDATA|CLIENTNUMBER()|DOCSERNO("+serno+")|TABLENAME(HRFORM)|SESSIONID(S||SESSIONID||)|SUMMATION(DummyDiv)|CONFIRMSCREEN(SAVECONFIRMREFRESHSUMMARY)^";

}
